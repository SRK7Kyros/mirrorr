name: Android Debug APK

on:
  workflow_dispatch:

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install web dependencies
        run: bun install
        working-directory: mirrorr-web

      - name: Install mobile dependencies
        run: bun install
        working-directory: mirrorr-mobile

      - name: Type-check web
        run: bun run typecheck
        working-directory: mirrorr-web

      - name: Build Android debug APK
        run: bun run build:android:debug
        working-directory: mirrorr-mobile

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mirrorr-android-debug-apk
          path: mirrorr-mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
