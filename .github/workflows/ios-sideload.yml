name: iOS Sideload IPA

on:
  workflow_dispatch:

concurrency:
  group: ios-sideload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-sideload:
    name: Unsigned sideload IPA
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install web dependencies
        run: bun install
        working-directory: mirrorr-web

      - name: Build web + prepare wrapper assets
        run: bun run mobile:build
        working-directory: mirrorr-web

      - name: Add iOS platform
        run: bunx cap add ios
        working-directory: mirrorr-web

      - name: Sync web assets to native project
        run: bunx cap sync ios
        working-directory: mirrorr-web

      - name: Build unsigned app (sideload)
        run: |
          xcodebuild -quiet -project mobile/ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO build \
            -derivedDataPath build
        working-directory: mirrorr-web

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qr Mirrorr.ipa Payload
        working-directory: mirrorr-web

      - uses: actions/upload-artifact@v4
        with:
          name: mirrorr-ipa
          path: mirrorr-web/Mirrorr.ipa

      - name: Build Feather source file
        run: |
          IPA_SIZE=$(stat -f%z mirrorr-web/Mirrorr.ipa)
          TODAY=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 - "$IPA_SIZE" "$TODAY" <<'EOF'
          import json, sys
          size, today = int(sys.argv[1]), sys.argv[2]
          repo = "https://raw.githubusercontent.com/SRK7Kyros/mirrorr/main/mirrorr-web/public"
          source = {
            "name": "Mirrorr IPA",
            "identifier": "com.mirrorr.app-repo",
            "iconURL": f"{repo}/icon-180.png",
            "website": "https://github.com/SRK7Kyros/mirrorr",
            "apps": [
              {
                "name": "Mirrorr",
                "bundleIdentifier": "com.mirrorr.app",
                "developerName": "SRK7Kyros",
                "iconURL": f"{repo}/icon-180.png",
                "localizedDescription": "Mirrorr is a self-hosted event-driven media ingest console. Connect to your server, run sessions, schedule autoruns, browse recordings, and manage profiles from your phone.",
                "subtitle": "Self-hosted media ingest console",
                "tintColor": "863bff",
                "versions": [
                  {
                    "version": "1.0.0",
                    "date": today,
                    "size": size,
                    "downloadURL": "https://github.com/SRK7Kyros/mirrorr/releases/download/nightly/Mirrorr.ipa",
                  }
                ],
                "appPermissions": {},
                "screenshotURLs": [],
              }
            ],
            "news": [],
          }
          with open("mirrorr-web/app-repo.json", "w") as f:
            json.dump(source, f, indent=2)
          EOF
        working-directory: .

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create nightly mirrorr-web/Mirrorr.ipa mirrorr-web/app-repo.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mirrorr nightly IPA" \
            --notes "Unsigned Mirrorr build for sideloading (Feather/Sideloadly/AltStore)." \
            --target "$GITHUB_SHA"
