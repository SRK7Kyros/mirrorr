name: iOS Sideload IPA

on:
  workflow_dispatch:
  # The console is served from each host's own origin, so a web change never
  # alters the IPA — only a change to the bundled shell, its native deps, or
  # this build needs a new one. Publishing to the phone stays a deliberate
  # step (mirrorr-web/mobile/README.md), so this only refreshes the artifact.
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-sideload.yml"
      - "mirrorr-web/capacitor.config.ts"
      - "mirrorr-web/mobile/**"
      - "mirrorr-web/package.json"
      - "mirrorr-web/bun.lock"

concurrency:
  group: ios-sideload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-sideload:
    name: Unsigned sideload IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install web dependencies
        run: bun install --frozen-lockfile
        working-directory: mirrorr-web

      - name: Add iOS platform
        run: bunx cap add ios
        working-directory: mirrorr-web

      # The template ships Apple's placeholder mark, so the home screen icon is
      # not Mirrorr's. Replace that single 1024 image (Xcode derives every other
      # size from it) and fail loudly if the template's layout ever moves.
      - name: Install the app icon
        run: |
          cp mobile/assets/app-icon-1024.png \
            "mobile/ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          test -f "mobile/ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
        working-directory: mirrorr-web

      # The UI is dark-only, so the system status bar must always render light
      # text — otherwise a phone in light mode paints a near-invisible clock
      # over our own top bar.
      - name: Pin the status bar to light content
        run: |
          plutil -replace UIStatusBarStyle -string UIStatusBarStyleLightContent mobile/ios/App/App/Info.plist
          plutil -replace UIViewControllerBasedStatusBarAppearance -bool NO mobile/ios/App/App/Info.plist
        working-directory: mirrorr-web

      - name: Sync shell content to the native project
        run: bunx cap sync ios
        working-directory: mirrorr-web

      - name: Build unsigned app (sideload)
        run: |
          # Both app builds stamp mirrorr-web/mobile/shell-version.txt, so the two
          # platforms cannot drift apart on the version a phone has to see before
          # it will offer an update.
          VERSION=$(cat mobile/shell-version.txt)
          test -n "$VERSION"
          xcodebuild -quiet -project mobile/ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -derivedDataPath build
        working-directory: mirrorr-web

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qr Mirrorr.ipa Payload
        working-directory: mirrorr-web

      - uses: actions/upload-artifact@v4
        with:
          name: mirrorr-ipa
          path: mirrorr-web/Mirrorr.ipa
          retention-days: 14
