name: Web checks

on:
  push:
  pull_request:

concurrency:
  group: web-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web install, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install web dependencies
        run: bun install
        working-directory: mirrorr-web

      - name: Type-check web
        run: bun run typecheck
        working-directory: mirrorr-web

      - name: Run unit tests
        run: bun run test:unit
        working-directory: mirrorr-web

      - name: Build web
        run: bun run build
        working-directory: mirrorr-web
