# Mirrorr — web UI (static SPA) + API/WS proxy to the local backend.
# Template: deploy.sh substitutes the __PLACEHOLDERS__ from mirrorr.local.env.
server {
    server_name __SERVER_NAME__;

    client_max_body_size 10m;

    gzip on;
    gzip_proxied any;
    gzip_types text/css text/javascript application/json image/svg+xml;

    # ── API proxy: strip the /api prefix, forward to the local backend ──
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health check (no /api prefix)
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    # ── WebSocket proxy ──
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }


    # ── Never serve process logs: ffmpeg/yt-dlp print absolute server paths ──
    location ~ ^/content/.*(/logs/|/concat\.txt$) {
        deny all;
    }

    # ── Session media: HLS playlist + segments for the web player ──
    location /content/ {
        root __RUN_ROOT__/core;
        try_files $uri =404;
        types {
            text/html html htm;
            text/css css;
            application/javascript js;
            application/json json;
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
        add_header Cache-Control "no-store";
    }

    # ── Static SPA ──
    # The shell is the only pointer to the fingerprinted assets, so it must be
    # revalidated on every load: heuristically cached, a stale copy keeps
    # serving the previous build for hours after a deploy. `no-cache` still
    # allows a 304 via ETag/Last-Modified.
    location / {
        root __RUN_ROOT__/web;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Immutable fingerprinted assets
    location /assets/ {
        root __RUN_ROOT__/web;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Admin SPA: the build that carries the admin surfaces ──
    # nginx asks the API whether this caller is an admin; the standard build
    # under run/web has no admin code to reach, so this is the only door to it.
    location = /__admin {
        internal;
        proxy_pass http://127.0.0.1:8000/auth/admin-surface;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        auth_request /__admin;
        root __RUN_ROOT__;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache";
    }

    location /admin/assets/ {
        auth_request /__admin;
        root __RUN_ROOT__;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/__CERT_NAME__/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/__CERT_NAME__/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = __SERVER_NAME__) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name __SERVER_NAME__;

    # ACME HTTP-01 (webroot) - must precede the HTTPS redirect
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }


}
