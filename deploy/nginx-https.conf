# ═══════════════════════════════════════════════════════════════════════
# Mirrorr — HTTPS nginx config (VPS / public exposure)
# ═══════════════════════════════════════════════════════════════════════
#
# Prerequisites:
#   1. Domain pointing to this VPS (e.g. via DuckDNS)
#   2. certbot installed: apt install certbot python3-certbot-nginx
#   3. Get initial cert:
#        certbot certonly --standalone -d your-domain.duckdns.org
#
# Usage:
#   1. Copy to /etc/nginx/sites-available/mirrorr
#   2. ln -s /etc/nginx/sites-available/mirrorr /etc/nginx/sites-enabled/
#   3. Edit the USER CONFIG section below
#   4. nginx -t && systemctl reload nginx
#
# Auto-renewal is handled by the certbot systemd timer (installed by apt).
# ═══════════════════════════════════════════════════════════════════════

# ── USER CONFIG (edit these) ─────────────────────────────────────────
upstream mirrorr {
    server 127.0.0.1:8000;       # uvicorn bind address
}

server_name your-domain.duckdns.org;

ssl_certificate     /etc/letsencrypt/live/your-domain.duckdns.org/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/your-domain.duckdns.org/privkey.pem;

content_root /path/to/mirrorr/content/;  # <-- edit: content_dir path
# ─────────────────────────────────────────────────────────────────────

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;

    # ── TLS hardening ────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ── Static content (recordings, HLS, logs) ──────────────────────
    location /content/ {
        alias $content_root/content/;
        autoindex on;

        types {
            application/vnd.apple.mpegurl m3u8;
            application/json             json;
            video/mp2t                   ts;
            video/mp4                    mp4;
            text/plain                   log;
        }

        add_header Access-Control-Allow-Origin *;

        # Cache immutable segments
        location ~* \.(ts|mp4)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── API ──────────────────────────────────────────────────────────
    location / {
        proxy_pass http://mirrorr;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket ────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://mirrorr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
