# Mirrorr — web UI (static SPA) + API/WS proxy to the local backend.
server {
    server_name __SERVER_NAME__;

    client_max_body_size 10m;

    gzip on;
    gzip_proxied any;
    gzip_types text/css text/javascript application/json image/svg+xml;

    # ── API proxy: strip the /api prefix, forward to the local backend ──
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health check (no /api prefix)
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    # ── WebSocket proxy ──
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }


    # ── Static SPA ──
    location / {
        root __REPO_ROOT__/dev/web;
        try_files $uri $uri/ /index.html;
    }

    # Immutable fingerprinted assets
    location /assets/ {
        root __REPO_ROOT__/dev/web;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Admin SPA: the build that carries the admin surfaces ──
    # nginx asks the API whether this caller is an admin; the standard build
    # under dev/web has no admin code to reach, so this is the only door to it.
    location = /__admin {
        internal;
        proxy_pass http://127.0.0.1:8000/auth/admin-surface;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        auth_request /__admin;
        root __REPO_ROOT__/dev;
        try_files $uri $uri/ /admin/index.html;
    }

    location /admin/assets/ {
        auth_request /__admin;
        root __REPO_ROOT__/dev;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/__CERT_NAME__/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/__CERT_NAME__/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = __SERVER_NAME__) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name __SERVER_NAME__;

    # ACME HTTP-01 (webroot) - must precede the HTTPS redirect
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }


}
