# Mirrorr — web UI (static SPA) + API/WS proxy to the local backend.
server {
    server_name mirrorr.bigbro-itzamekyros.duckdns.org;

    client_max_body_size 10m;

    gzip on;
    gzip_proxied any;
    gzip_types text/css text/javascript application/json image/svg+xml;

    # ── API proxy: strip the /api prefix, forward to the local backend ──
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health check (no /api prefix)
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    # ── WebSocket proxy ──
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Static SPA ──
    location / {
        root /home/opc/everything/kyros/code/mirrorr/dev/web;
        try_files $uri $uri/ /index.html;
    }

    # Immutable fingerprinted assets
    location /assets/ {
        root /home/opc/everything/kyros/code/mirrorr/dev/web;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bigbro-itzamekyros.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bigbro-itzamekyros.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = mirrorr.bigbro-itzamekyros.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name mirrorr.bigbro-itzamekyros.duckdns.org;
    return 404; # managed by Certbot
}