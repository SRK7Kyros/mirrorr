# ═══════════════════════════════════════════════════════════════════════
# Mirrorr — HTTP-only nginx config (local / LAN / reverse proxy)
# ═══════════════════════════════════════════════════════════════════════
#
# Usage:
#   1. Copy to /etc/nginx/sites-available/mirrorr
#   2. ln -s /etc/nginx/sites-available/mirrorr /etc/nginx/sites-enabled/
#   3. Edit the USER CONFIG section below
#   4. nginx -t && systemctl reload nginx
#
# This config is for when nginx sits on the same machine as Mirrorr,
# or when TLS is handled upstream (cloud load balancer, CDN, etc).
# ═══════════════════════════════════════════════════════════════════════

# ── USER CONFIG (edit these) ─────────────────────────────────────────
upstream mirrorr {
    server 127.0.0.1:8000;       # uvicorn bind address
}

server_name localhost;            # your domain or IP
# ─────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    # ── Static content (recordings, HLS, logs) ──────────────────────
    location /content/ {
        alias /path/to/mirrorr/content/;   # <-- edit: content_dir path
        autoindex on;

        types {
            application/vnd.apple.mpegurl m3u8;
            application/json             json;
            video/mp2t                   ts;
            video/mp4                    mp4;
            text/plain                   log;
        }

        add_header Access-Control-Allow-Origin *;
    }

    # ── API ──────────────────────────────────────────────────────────
    location / {
        proxy_pass http://mirrorr;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── WebSocket ────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://mirrorr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
