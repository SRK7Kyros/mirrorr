<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@videojs/html/cdn/video.css"
        />
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                background: #000;
                overflow: hidden;
                /* The outer video frame only — the skin's own control chrome
                   keeps its radii. */
                --media-border-radius: 0;
                --media-video-border-radius: 0;
            }
            video-player,
            video-skin {
                display: block;
                width: 100%;
                height: 100%;
            }
            #media-el {
                width: 100%;
                height: 100%;
                display: block;
                background: #000;
            }
        </style>
    </head>
    <body>
        <video-player>
            <video-skin>
                <hlsjs-video id="media-el" autoplay muted playsinline preload="auto"></hlsjs-video>
            </video-skin>
        </video-player>

        <script
            type="module"
            src="https://cdn.jsdelivr.net/npm/@videojs/html/cdn/video.js"
        ></script>
        <script
            type="module"
            src="https://cdn.jsdelivr.net/npm/@videojs/cdn@10.1.0/media/hlsjs-video.js"
        ></script>
        <script>
            (function () {
                function mediaEl() {
                    return document.getElementById("media-el");
                }

                // --- Rewind control ---
                // The packaged skin renders its control bar inside a shadow root
                // and documents no slot for extra controls, so insert a native
                // <media-seek-button> beside the play button. Both it and the
                // play button are public element names; if a future skin release
                // stops rendering one, the control is simply omitted.
                // The ring is the skin's own restart outline, left unstroked so
                // its band stays the even 2-unit weight the built-in glyphs use;
                // stroking it inflated the arrowhead into a blob. The number is
                // nudged off the geometric centre because the digits' ink sits
                // high in the em box and the "1" carries more bearing than the "0".
                var REWIND_ICON =
                    '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="currentColor" class="media-icon media-button-icon" aria-hidden="true">' +
                    '<path d="M9 1a7.98 7.98 0 0 0-6.132 2.867l-1.441-1.44A.25.25 0 0 0 1 2.604V6.75c0 .138.112.25.25.25h4.146a.25.25 0 0 0 .177-.427L4.29 5.29A5.99 5.99 0 0 1 9 3a6 6 0 1 1-6 6H1a8 8 0 1 0 8-8"/>' +
                    '<text x="8.8" y="8.72" text-anchor="middle" dominant-baseline="central" font-size="7.5" font-weight="800" fill="currentColor">10</text>' +
                    "</svg>";

                function deepFind(root, selector) {
                    var hit = root.querySelector(selector);
                    if (hit !== null) return hit;
                    var all = root.querySelectorAll("*");
                    for (var i = 0; i < all.length; i++) {
                        if (all[i].shadowRoot !== null) {
                            hit = deepFind(all[i].shadowRoot, selector);
                            if (hit !== null) return hit;
                        }
                    }
                    return null;
                }

                function addRewind() {
                    if (!customElements.get("media-seek-button")) return false;
                    var play = deepFind(document.body, "media-play-button");
                    if (play === null) return false;
                    if (play.parentElement.querySelector(".media-seek-button") !== null)
                        return true;
                    var button = document.createElement("media-seek-button");
                    button.className =
                        "media-button media-button--subtle media-button--icon media-seek-button";
                    button.seconds = -10;
                    button.setAttribute("seconds", "-10");
                    button.innerHTML = REWIND_ICON;
                    play.parentElement.insertBefore(button, play);
                    return true;
                }

                // The bar appears once the skin upgrades, so retry until then.
                var rewindDeadline = Date.now() + 15000;
                (function awaitRewindSlot() {
                    if (addRewind() || Date.now() > rewindDeadline) return;
                    requestAnimationFrame(awaitRewindSlot);
                })();

                // --- Square corners ---
                // Frame only: its radius is the skin's own token, set in the light
                // DOM below. The chrome hard-codes its radii, so leaving it alone
                // keeps the skin's own look.

                // --- Source resolution ---
                var params = new URLSearchParams(window.location.search);
                var src = params.get("src");
                if (!src) {
                    document.title = "Mirrorr Player — no source";
                    return;
                }

                var filename = decodeURIComponent(src)
                    .split("/")
                    .pop()
                    .split("?")[0];
                document.title = "Mirrorr Player — " + filename;
                var sourceUrl = new URL(src, window.location.href).toString();
                var isHls = /\.m3u8(\?|$)/.test(sourceUrl);

                // --- Start playback ---
                // HLS (live sessions and recordings) is handled by the
                // <hlsjs-video> media element: adaptive playback with native
                // fallback. Anything else falls back to a plain <video>.
                function start() {
                    var m = mediaEl();
                    if (m === null) return;
                    if (isHls) {
                        m.setAttribute("src", sourceUrl);
                        return;
                    }
                    var v = document.createElement("video");
                    v.id = "media-el";
                    v.muted = true;
                    v.playsInline = true;
                    v.preload = "auto";
                    v.autoplay = true;
                    v.src = sourceUrl;
                    m.replaceWith(v);
                    v.play().catch(function () {});
                }

                // --- Init ---
                // Muted/autoplay come from the element's attributes; wait for
                // the custom elements so <hlsjs-video> is upgraded on first paint.
                if (customElements && customElements.whenDefined) {
                    Promise.all([
                        customElements.whenDefined("video-player"),
                        customElements.whenDefined("hlsjs-video"),
                    ])
                        .then(start)
                        .catch(start);
                } else {
                    start();
                }
            })();
        </script>
    </body>
</html>
