<!doctype html>
<!-- Wrapper document of record for the Capacitor build: the mobile asset step
     copies this file to mobile/dist/index.html. Viewport-locked so pinch
     reaches the app grid instead of page-zooming the shell; index.html keeps
     desktop page zoom. Never hand-edit the generated copy — this file is the
     source, that directory the artifact. -->
<html lang="en" data-wrapper="capacitor">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Mirrorr</title>
  </head>
  <body>
    <div id="root" data-app="mirrorr-web"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
