<!doctype html>
<!-- Wrapper document of record (spec L582): the Capacitor build copies this file
     to mobile/dist/index.html. It is viewport-locked so pinch reaches the grid
     instead of page-zooming the shell; index.html keeps desktop page zoom. Never
     hand-edit mobile/dist — this file is the source, that directory the artifact. -->
<html lang="en" data-wrapper="capacitor">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B0D11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Mirrorr</title>
  </head>
  <body>
    <div id="root" data-app="mirrorr-web"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
