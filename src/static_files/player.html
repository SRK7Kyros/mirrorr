<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@videojs/html/cdn/video.css"
        />
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                background: #000;
                overflow: hidden;
                --media-border-radius: 0;
                --media-video-border-radius: 0;
            }
            video-player,
            video-skin {
                display: block;
                width: 100%;
                height: 100%;
            }
            #media-el {
                width: 100%;
                height: 100%;
                display: block;
                background: #000;
            }
        </style>
    </head>
    <body>
        <video-player>
            <video-skin>
                <video id="media-el" playsinline></video>
            </video-skin>
        </video-player>

        <script
            type="module"
            src="https://cdn.jsdelivr.net/npm/@videojs/html/cdn/video.js"
        ></script>
        <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
        <script>
            (function () {
                var video = document.getElementById("media-el");

                // --- Source resolution ---
                var params = new URLSearchParams(window.location.search);
                var src = params.get("url") || params.get("src");
                if (!src) {
                    document.title = "Mirrorr Player — no source";
                    return;
                }

                var filename = decodeURIComponent(src)
                    .split("/")
                    .pop()
                    .split("?")[0];
                document.title = "Mirrorr Player — " + filename;
                var sourceUrl = new URL(src, window.location.href).toString();
                var isHls = /\.m3u8(\?|$)/.test(sourceUrl);

                // --- HLS.js setup ---
                var hls = null;

                function startHlsJs() {
                    hls = new Hls({
                        liveSyncDurationCount: 3,
                        liveMaxLatencyDurationCount: 6,
                        maxBufferLength: 30,
                        maxMaxBufferLength: 600,
                        backBufferLength: 30,
                        lowLatencyMode: true,
                        enableWorker: true,
                        testBandwidth: true,
                    });

                    hls.loadSource(sourceUrl);
                    hls.attachMedia(video);

                    hls.on(Hls.Events.MANIFEST_PARSED, function () {
                        video.play().catch(function () {});
                    });

                    hls.on(Hls.Events.ERROR, function (event, data) {
                        if (!data.fatal) return;
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                            default:
                                hls.destroy();
                                break;
                        }
                    });
                }

                function startNative() {
                    video.src = sourceUrl;
                    video.play().catch(function () {});
                }

                // --- Init ---
                function init() {
                    video.controls = false;
                    video.preload = "auto";

                    if (isHls && window.Hls && Hls.isSupported()) {
                        startHlsJs();
                    } else if (
                        isHls &&
                        video.canPlayType("application/vnd.apple.mpegurl")
                    ) {
                        startNative();
                    } else {
                        startNative();
                    }
                }

                if (customElements && customElements.whenDefined) {
                    customElements
                        .whenDefined("video-player")
                        .then(init)
                        .catch(init);
                } else {
                    init();
                }
            })();
        </script>
    </body>
</html>
